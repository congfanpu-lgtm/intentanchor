# AgentDojo v1.2.2 每个工具有没有副作用（设计文档 §4.4）。
# true：调用会改变外部状态，或者能把数据发出去，守卫要检查；false：只读，直接放行。
# 读取隐私数据的工具（get_user_info、read_file 等）算只读：数据要泄露，还需要后面一次 true 的调用把它发出去。
# 校验：.venv-serve/bin/python scripts/check_side_effect.py

workspace:
  send_email: true
  delete_email: true
  get_unread_emails: false            # 会把邮件标为已读，但只是阅读状态，不算副作用
  get_sent_emails: false
  get_received_emails: false
  get_draft_emails: false
  search_emails: false
  search_contacts_by_name: false
  search_contacts_by_email: false
  get_current_day: false
  search_calendar_events: false
  get_day_calendar_events: false
  create_calendar_event: true         # 可以带参会人，等于给外部发邀请
  cancel_calendar_event: true
  reschedule_calendar_event: true
  add_calendar_event_participants: true
  append_to_file: true
  search_files_by_filename: false
  create_file: true
  delete_file: true
  get_file_by_id: false
  list_files: false
  share_file: true
  search_files: false

