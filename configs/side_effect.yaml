slack:
  get_channels: false
  add_user_to_channel: true
  read_channel_messages: false
  read_inbox: false
  send_direct_message: true
  send_channel_message: true
  get_users_in_channel: false
  invite_user_to_slack: true
  remove_user_from_slack: true
  get_webpage: true                   # 访问任意网址：数据可以拼在网址里带出去，也会把用户带到钓鱼网站
  post_webpage: true
