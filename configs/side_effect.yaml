  get_contact_information_for_restaurants: false
  get_price_for_restaurants: false
  check_restaurant_opening_hours: false
  get_all_car_rental_companies_in_city: false
  get_car_types_available: false
  get_rating_reviews_for_car_rental: false
  get_car_fuel_options: false
  get_car_rental_address: false
  get_car_price_per_day: false
  create_calendar_event: true
  search_calendar_events: false
  get_day_calendar_events: false
  cancel_calendar_event: true
  reserve_hotel: true
  reserve_car_rental: true
  reserve_restaurant: true
  get_flight_information: false
  send_email: true

banking:
  get_iban: false
  send_money: true
  schedule_transaction: true
  update_scheduled_transaction: true
  get_balance: false
  get_most_recent_transactions: false
  get_scheduled_transactions: false
  read_file: false
  get_user_info: false
